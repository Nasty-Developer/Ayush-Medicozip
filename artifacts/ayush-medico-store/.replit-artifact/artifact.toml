kind = "web"
previewPath = "/ayush-medico-store/"
title = "Ayush Medico Storefront"
description = "The imported Ayush Medico storefront for browsing Ayurvedic medicines and wellness products and placing delivery orders."
version = "1.0.0"
id = "artifacts/ayush-medico-store"
router = "path"

[[services]]
name = "web"
paths = [ "/ayush-medico-store/" ]
localPort = 20348

[services.development]
run = "pnpm --filter @workspace/ayush-medico-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ayush-medico-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/ayush-medico-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20348"
BASE_PATH = "/ayush-medico-store/"
