kind = "web"
previewPath = "/"
title = "Ayush Medico"
description = "A pharmacy storefront for Ayush Medico & General Stores, helping customers browse medicines and health products, request prescriptions, place orders, and contact the local pharmacy."
version = "1.0.0"
id = "artifacts/ayush-medico"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18169

[services.development]
run = "pnpm --filter @workspace/ayush-medico run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ayush-medico", "run", "build" ]
serve = "static"
publicDir = "artifacts/ayush-medico/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18169"
BASE_PATH = "/"
