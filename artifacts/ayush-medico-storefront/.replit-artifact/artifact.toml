kind = "web"
previewPath = "/"
title = "Ayush Medico Storefront"
description = "The public storefront for Ayush Medico, helping customers browse Ayurvedic medicines and wellness products, explore categories, and place delivery orders."
version = "1.0.0"
id = "artifacts/ayush-medico-storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25342

[services.development]
run = "pnpm --filter @workspace/ayush-medico-storefront run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ayush-medico-storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/ayush-medico-storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25342"
BASE_PATH = "/"
